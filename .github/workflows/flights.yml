# Google Flights scan every 20 min (public repo: GitHub-hosted runners are free). Japan first, then China / SE Asia.
# Results go to the orphan branch "flight-data" (flight_checks.json); Atlas reads them on its runs.
name: flight-checks
on:
  schedule:
    # owner wants near-continuous checking (golden route first): every 20 minutes
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: Google queries this run (default from search_config.json)
        required: false
        default: ""
      serp:
        description: "SerpApi: 'sweep' = full check of all Japan ticket groups; 'links' = refresh booking pages of the best flights; 'pax2' = golden flight for 2 adults; empty = daily split"
        required: false
        default: ""
  push:
    branches: [claude/compassionate-hawking-lq51s3]
    paths: [".github/workflows/flights.yml", "scan_flights.py", "search_config.json", "gflights.js", "flights.py", "routes.json", "planner.py", "merge_checks.py", "serp_scan.py"]
permissions:
  contents: write
concurrency:
  group: flight-checks
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Previous checks
        run: |
          if git fetch -q --depth 1 origin flight-data; then git show FETCH_HEAD:flight_checks.json > prev.json; else echo '{}' > prev.json; fi
          git fetch -q --depth 1 origin ${{ github.ref_name }} && git show FETCH_HEAD:local_checks.json > local_checks.json 2>/dev/null || true
          [ -s local_checks.json ] && python3 merge_checks.py prev.json local_checks.json prev.json || true
      - name: SerpApi checks (Japan only, capped at 8 a day / 240 a month)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 serp_scan.py prev.json prev.json prev.json ${{ github.event.inputs.serp }} || echo "SerpApi step failed, free scan goes on"
      - name: Scan flights
        env:
          GOOGLE_BUDGET: ${{ github.event.inputs.budget }}
        run: python3 scan_flights.py search_config.json prev.json flight_checks.json
      - name: Save to flight-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # merge with whatever another scanner saved meanwhile, so nobody overwrites anybody
          if git fetch -q --depth 1 origin flight-data; then git show FETCH_HEAD:flight_checks.json > latest.json; else echo '{}' > latest.json; fi
          [ -f local_checks.json ] && python3 merge_checks.py latest.json local_checks.json latest.json
          python3 merge_checks.py latest.json prev.json latest.json
          python3 merge_checks.py latest.json flight_checks.json merged.json && mv merged.json flight_checks.json
          mkdir /tmp/fd && cp flight_checks.json /tmp/fd/ && cd /tmp/fd
          git init -q -b flight-data
          git config user.name "flight-checks"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight_checks.json && git commit -qm "flight checks $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" flight-data
