# Hotel re-check for the booked golden route (SerpApi Google Hotels, about 25 searches). Run by hand only.
# Results go to the orphan branch "hotel-data" (hotel_checks.json); Atlas/Claude reads them from there.
name: hotel-checks
on:
  workflow_dispatch:
    inputs:
      pages:
        description: result pages per city (20 hotels each)
        required: false
        default: "2"
      details:
        description: price-per-site lookups for the top hotels of each city
        required: false
        default: "3"
      cities:
        description: comma-separated cities (empty = all five)
        required: false
        default: ""
permissions:
  contents: write
jobs:
  hotels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SerpApi Google Hotels
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 serp_hotels.py hotel_checks.json --pages "${{ github.event.inputs.pages || '2' }}" --details "${{ github.event.inputs.details || '3' }}" --cities "${{ github.event.inputs.cities }}"
      - name: Save to hotel-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/hd && cp hotel_checks.json /tmp/hd/ && cd /tmp/hd
          git init -q -b hotel-data
          git config user.name "hotel-checks"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotel_checks.json && git commit -qm "hotel checks $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hotel-data
